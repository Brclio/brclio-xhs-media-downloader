name: Android debug APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'learn.*'
      - 'aiyc.svg'
      - 'favicon.svg'
      - 'assets/learning/**'
      - 'assets/support/wechat-personal-qr.png'
      - 'scripts/build-android.mjs'
      - 'scripts/prepare-update-proxy.mjs'
      - 'desktop/resources/update-proxy/**'
      - 'scripts/publish-android-release.mjs'
      - 'test/android*.test.js'
      - 'test/update-proxy-runtime.test.js'
      - 'package.json'
      - '.github/workflows/android-build.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'learn.*'
      - 'aiyc.svg'
      - 'favicon.svg'
      - 'assets/learning/**'
      - 'assets/support/wechat-personal-qr.png'
      - 'scripts/build-android.mjs'
      - 'scripts/prepare-update-proxy.mjs'
      - 'desktop/resources/update-proxy/**'
      - 'scripts/publish-android-release.mjs'
      - 'test/android*.test.js'
      - 'test/update-proxy-runtime.test.js'
      - 'package.json'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 35 and pinned launcher NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify update proxy provisioning without subscription defaults
        run: node --test test/update-proxy-runtime.test.js
      - name: Test member browser entry and native video policy, lint and build debug APK
        # build-android runs every android*.test.js and :app:testDebugUnitTest before assembly.
        run: npm run android:build
      - name: Confirm the original-video and redirect JUnit gate ran
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const xml = readFileSync('android/app/build/test-results/testDebugUnitTest/TEST-com.brclio.xhs.NativePolicyTest.xml', 'utf8');
          const result = xml.match(/<testcase\b[^>]*\bname="nativeVideoTransfersOnlyAcceptOrdinaryPlaybackIncludingEveryRedirectTarget"[^>]*(?:\/>|>[\s\S]*?<\/testcase>)/)?.[0];
          assert.ok(result, 'The native original-video/redirect policy test did not execute');
          assert.doesNotMatch(result, /<(?:skipped|failure|error)\b/, 'The native policy test must pass without being skipped');
          NODE
      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Brclio-XHS-Android-debug-${{ github.run_number }}
          path: |
            dist-android/*.apk
            dist-android/*.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-${{ github.run_number }}
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
