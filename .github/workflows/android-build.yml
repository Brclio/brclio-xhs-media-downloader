name: Android debug APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/build-android.mjs'
      - 'scripts/publish-android-release.mjs'
      - 'test/android*.test.js'
      - 'package.json'
      - '.github/workflows/android-build.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/build-android.mjs'
      - 'scripts/publish-android-release.mjs'
      - 'test/android*.test.js'
      - 'package.json'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and build debug APK
        run: npm run android:build
      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Brclio-XHS-Android-debug-${{ github.run_number }}
          path: |
            dist-android/*.apk
            dist-android/*.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-${{ github.run_number }}
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
