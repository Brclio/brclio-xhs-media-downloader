name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to rebuild and publish (leave empty for a build only)
        required: false
        type: string
  push:
    tags: ['v*', 'desktop-v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            label: mac-arm64
          - os: macos-15-intel
            arch: x64
            label: mac-intel
          - os: windows-latest
            arch: x64
            label: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Validate requested release tag
        if: inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - run: npm ci
      # Electron 44 downloads its runtime lazily. Parallel native tests must
      # never both extract into node_modules/electron/dist at the same time.
      - name: Initialize Electron before concurrent native tests
        run: node -e "require('electron')"
      - run: npm run test:node
      - name: Verify native Mac replacement and rollback in temporary signed apps
        if: runner.os != 'Windows'
        run: node --test test/mac-update.test.js test/mac-update-cleanup.test.js test/startup-ready.test.js test/mac-install-progress.test.js
        env:
          XHS_MAC_UPDATE_NATIVE: '1'
          MAC_INSTALL_PROGRESS_NATIVE: '1'
      - run: python -m unittest discover -s test -p 'test_python_*.py'
      - if: runner.os != 'Windows'
        run: python scripts/build-mac-python.py
      - if: runner.os == 'Windows'
        run: python scripts/build-windows-python.py
      - name: Verify bundled Python handlers
        run: node --test test/desktop-python.test.js
        env:
          XHS_REQUIRE_BUNDLED_PYTHON: '1'
      - name: Build complete Mac installers with ad hoc code signatures
        if: runner.os != 'Windows'
        # Explicit identity '-' signs the full app and its nested code. Disabling
        # certificate discovery alone skips signing; ad hoc is not notarization.
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never --config.mac.identity=-
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build complete Windows installers with bundled Python
        if: runner.os == 'Windows'
        run: npx electron-builder --win --${{ matrix.arch }} --publish never
      - name: Verify packaged source, native runtime, installers, and checksums
        shell: bash
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            env GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" node scripts/verify-built-installers.mjs
          else
            node scripts/verify-built-installers.mjs
          fi
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
      - name: Exercise real Electron main process, bridge, and both download engines
        run: npm run desktop:verify
      - name: Verify responsive startup and credential access recovery
        run: npm run desktop:verify:startup
      - name: Verify retry and update controls in the real desktop renderer
        run: npx electron scripts/verify-desktop-ui.mjs
      - name: Verify membership purchase and redemption in the real desktop renderer
        # Isolated fake account bridge; no real emails, payments or account writes.
        run: npm run desktop:verify:membership
      - name: Verify native credential encryption across two app processes
        run: npm run desktop:verify:account
      - uses: actions/upload-artifact@v4
        with:
          name: Brclio-XHS-Downloader-${{ matrix.label }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.exe
            dist-desktop/release-proof-*.json

  release:
    name: Publish verified installers
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: Brclio-XHS-Downloader-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify all platforms and publish the complete release
        run: env GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" node scripts/publish-desktop-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
