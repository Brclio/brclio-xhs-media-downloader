name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to rebuild and publish (leave empty for a build only)
        required: false
        type: string
  push:
    tags: ['v*', 'desktop-v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            label: mac-arm64
          - os: macos-26-intel
            arch: x64
            label: mac-intel
          - os: windows-latest
            arch: x64
            label: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Validate requested release tag
        if: inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - run: npm ci
      - name: Prepare the verified update proxy runtime without subscription defaults
        run: node scripts/prepare-update-proxy.mjs --arch ${{ matrix.arch }}
      # Electron 44 downloads its runtime lazily. Parallel native tests must
      # never both extract into node_modules/electron/dist at the same time.
      - name: Initialize Electron before concurrent native tests
        run: node -e "require('electron')"
      # Large-file disk fixtures and native PowerShell / Swift / Electron
      # subprocesses share the runner. Serialize files to keep their existing
      # readiness budgets meaningful; every test and assertion still runs.
      - run: node --test --test-concurrency=1
      - name: Verify native Mac replacement and rollback in temporary signed apps
        if: runner.os != 'Windows'
        # These files launch real AppKit/Electron windows, sign bundles and mount
        # DMGs. Serialize them so one fixture cannot consume another's bounded
        # readiness budget; every native acceptance gate still executes.
        run: node --test --test-concurrency=1 test/mac-update.test.js test/mac-update-cleanup.test.js test/startup-ready.test.js test/mac-install-progress.test.js
        env:
          XHS_MAC_UPDATE_NATIVE: '1'
          MAC_INSTALL_PROGRESS_NATIVE: '1'
      - run: python -m unittest discover -s test -p 'test_python_*.py'
      - name: Verify native Live Photo image, slideshow, video and audio encoding
        run: npm run desktop:verify:live-photo-codecs
      - if: runner.os != 'Windows'
        run: python scripts/build-mac-python.py
      - if: runner.os == 'Windows'
        run: python scripts/build-windows-python.py
      - name: Verify bundled Python handlers
        run: node --test test/desktop-python.test.js
        env:
          XHS_REQUIRE_BUNDLED_PYTHON: '1'
      - name: Build complete Mac installers with ad hoc code signatures
        if: runner.os != 'Windows'
        # Explicit identity '-' signs the full app and its nested code. Disabling
        # certificate discovery alone skips signing; ad hoc is not notarization.
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never --config.mac.identity=-
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build complete Windows installers with bundled Python
        if: runner.os == 'Windows'
        run: npx electron-builder --win --${{ matrix.arch }} --publish never
      - name: Verify packaged source, native runtime, installers, and checksums
        shell: bash
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            env GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" node scripts/verify-built-installers.mjs
          else
            node scripts/verify-built-installers.mjs
          fi
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
      - name: Verify real Windows installed and portable upgrades from published v1.8.17
        if: runner.os == 'Windows'
        timeout-minutes: 12
        run: node scripts/verify-packaged-windows-update.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Exercise real Electron main process, bridge, and both download engines
        timeout-minutes: 3
        # The bridge gate does not need a hardware GPU. Native codec acceptance
        # above continues to run separately with its normal renderer settings.
        run: npm run desktop:verify -- --disable-gpu
      - name: Verify native image clipboard and multi-file paste
        run: npm run desktop:verify:clipboard
      - name: Verify responsive startup and credential access recovery
        run: npm run desktop:verify:startup
      - name: Verify quitting during startup and reporting genuine startup failures
        run: |
          npm run desktop:verify:startup-quit
          npm run desktop:verify:startup-quit -- --startup-failure
      - name: Verify isolated Xiaohongshu login reset and preserved app session
        run: npm run desktop:verify:login-reset
      - name: Verify retry and update controls in the real desktop renderer
        run: npx electron scripts/verify-desktop-ui.mjs
      - name: Verify updater retries through the real manager, IPC and original preload
        # Deterministic offline streams only. Real subscriptions require explicit --live.
        timeout-minutes: 3
        run: npm run desktop:verify:update-retry
      - name: Verify public and packaged learning page assets, navigation and QR saving
        run: npm run build:web && npx electron scripts/verify-learning-ui.cjs
      - name: Verify anonymous VIP community access, responsive layout and original QR saving
        timeout-minutes: 3
        run: npx electron scripts/verify-vip-ui.cjs --disable-gpu
      - name: Verify membership purchase and redemption in the real desktop renderer
        # Isolated fake account bridge; no real emails, payments or account writes.
        run: npm run desktop:verify:membership
      - name: Verify member original videos and browser account authorization in the real renderer
        # Disposable account/media fixtures exercise guest, nonmember, member and authorization-loss flows.
        run: npm run desktop:verify:member-video
      - name: Verify feedback conversations and safe reply retries in the real desktop renderer
        run: npm run desktop:verify:feedback
      - name: Verify public feedback, browser login and private owner conversations
        run: npm run web:verify:feedback
      - name: Verify reviews and personal order history in real web and desktop renderers
        run: npm run commerce:verify
      - name: Verify confirmed revenue and order administration in a real browser
        if: runner.os != 'Windows'
        run: npm run admin:verify:commerce
      - name: Verify native credential encryption across two app processes
        run: npm run desktop:verify:account
      - uses: actions/upload-artifact@v4
        with:
          name: Brclio-XHS-${{ matrix.label }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.exe
            dist-desktop/release-proof-*.json

  release:
    name: Publish verified installers
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: Brclio-XHS-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify all platforms and publish the complete release
        run: env GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" node scripts/publish-desktop-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
