name: Android signed release

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Android tag matching the package version (must exist unless build_only is enabled)
        required: true
        type: string
      build_only:
        description: Verify this branch without publishing or requiring an existing release tag
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate Android-only tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: '[[ "$RELEASE_TAG" =~ ^android-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_only && github.ref || format('refs/tags/{0}', inputs.release_tag || github.ref_name) }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the stable Android signing key
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          ANDROID_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { androidVersion } from './scripts/publish-android-release.mjs';
          const source = readFileSync('android/app/build.gradle', 'utf8');
          assert.equal(source.match(/versionName\s+'([^']+)'/)?.[1], androidVersion(process.env.ANDROID_RELEASE_TAG));
          assert.match((process.env.ANDROID_SIGNING_CERT_SHA256 || '').replace(/:/g, ''), /^[a-fA-F0-9]{64}$/);
          const encoded = (process.env.ANDROID_SIGNING_KEYSTORE_BASE64 || '').replace(/\s/g, '');
          assert.match(encoded, /^[A-Za-z0-9+/]+={0,2}$/, 'Missing Android signing key secret');
          const key = Buffer.from(encoded, 'base64');
          assert.ok(key.length > 0 && key.toString('base64') === encoded, 'Invalid signing key encoding');
          writeFileSync(join(process.env.RUNNER_TEMP, 'brclio-android-release.keystore'), key, { mode: 0o600 });
          NODE
      - name: Test, lint, build and verify the signed APK
        run: npm run android:build:release
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/brclio-android-release.keystore
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
      - name: Upload signed build for emulator acceptance
        uses: actions/upload-artifact@v4
        with:
          name: Android-signed-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist-android/*-release.apk
            dist-android/*-release.apk.sha256
            dist-android/SHA256SUMS.txt
            dist-android/android-update.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-release-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: node -e "require('node:fs').rmSync(require('node:path').join(process.env.RUNNER_TEMP, 'brclio-android-release.keystore'), { force:true })"

  upgrade-emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_only && github.ref || format('refs/tags/{0}', inputs.release_tag || github.ref_name) }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install APK signature verifier
        run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: Android-signed-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist-android
      - name: Enable emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade the published APK and preserve its user setting
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: node scripts/verify-android-upgrade.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          ANDROID_UPGRADE_BASELINE_TAG: android-v1.0.2
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
      - name: Upload emulator-verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist-android/*-release.apk
            dist-android/*-release.apk.sha256
            dist-android/SHA256SUMS.txt
            dist-android/android-update.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload emulator upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-upgrade-emulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist-android/emulator-upgrade/*.json
            dist-android/emulator-upgrade/*.xml
            dist-android/emulator-upgrade/*.png
            dist-android/emulator-upgrade/*.txt
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [build, upgrade-emulator]
    if: ${{ !inputs.build_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_only && github.ref || format('refs/tags/{0}', inputs.release_tag || github.ref_name) }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: Android-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist-android
      - name: Verify uploaded bytes and publish without changing desktop Latest
        run: node scripts/publish-android-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
