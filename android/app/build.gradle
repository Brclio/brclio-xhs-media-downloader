plugins {
    id 'com.android.application'
}

def signingKeys = ['ANDROID_SIGNING_STORE_FILE', 'ANDROID_SIGNING_STORE_PASSWORD',
                   'ANDROID_SIGNING_KEY_ALIAS', 'ANDROID_SIGNING_KEY_PASSWORD']
def signingValues = signingKeys.collectEntries { [(it): System.getenv(it)] }
def hasReleaseSigning = signingValues.values().every { it != null && !it.isBlank() }

// Keep the public promotion pages identical to the website without checking in second copies.
def learningAssets = layout.buildDirectory.dir('generated/learningAssets')
def learningFiles = ['learn.html', 'learn.css', 'learn.js', 'vip.html', 'vip.css', 'vip.js', 'aiyc.svg', 'favicon.svg',
                     'assets/learning/book-promo.png', 'assets/support/wechat-personal-qr.png']
def syncLearningAssets = tasks.register('syncLearningAssets', Sync) {
    from(rootProject.projectDir.parentFile) {
        include learningFiles
        into 'www'
    }
    into learningAssets
    doFirst {
        learningFiles.each { path ->
            if (!new File(rootProject.projectDir.parentFile, path).isFile()) {
                throw new GradleException("Missing shared learning page asset: ${path}")
            }
        }
    }
}

// The proxy executable is extracted by Android's package manager; never execute writable app files.
def updateProxyFiles = layout.buildDirectory.dir('generated/updateProxy')
def prepareUpdateProxy = tasks.register('prepareUpdateProxy', Exec) {
    workingDir rootProject.projectDir.parentFile
    doFirst {
        commandLine 'node', 'scripts/prepare-update-proxy.mjs', '--platform', 'android'
    }
}

android {
    namespace 'com.brclio.xhs'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.brclio.xhs'
        minSdk 26
        targetSdk 35
        versionCode 10014
        versionName '1.0.14'
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets.main.assets.srcDir(learningAssets)
    sourceSets.main.assets.srcDir(updateProxyFiles.map { it.dir('assets') })
    sourceSets.main.jniLibs.srcDir(updateProxyFiles.map { it.dir('jniLibs') })

    packaging {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/libbrclio_update_proxy*.so']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(signingValues.ANDROID_SIGNING_STORE_FILE)
                storePassword signingValues.ANDROID_SIGNING_STORE_PASSWORD
                keyAlias signingValues.ANDROID_SIGNING_KEY_ALIAS
                keyPassword signingValues.ANDROID_SIGNING_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError true
    }
}

tasks.named('preBuild').configure { dependsOn syncLearningAssets, prepareUpdateProxy }

// Never silently produce an unsigned or debug-signed artifact labelled release.
gradle.taskGraph.whenReady { graph ->
    def needsSigning = graph.allTasks.any {
        it.project == project && it.name in ['packageRelease', 'signReleaseBundle', 'assembleRelease', 'bundleRelease']
    }
    if (needsSigning && !hasReleaseSigning) {
        throw new GradleException('Release signing requires all four ANDROID_SIGNING_* environment variables. See android/README.md.')
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.yaml:snakeyaml:2.7'
    testImplementation 'junit:junit:4.13.2'
    // Android's JSON classes are stubs in local unit tests; use the reference implementation there.
    testImplementation 'org.json:json:20250517'
}
